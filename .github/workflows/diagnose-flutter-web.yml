name: Verify published Viril Flutter Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-flutter-web.yml"

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chromium and screenshot parser
        run: |
          npm init -y
          npm install --save-dev playwright pngjs
          npx playwright install --with-deps chromium

      - name: Open the actual GitHub Pages URL in mobile Chromium
        run: |
          cat > verify-live.cjs <<'EOF'
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            const errors = [];
            const responses = [];
            page.on('pageerror', e => errors.push('PAGEERROR: ' + e.stack));
            page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE: ' + m.text()); });
            page.on('requestfailed', r => errors.push('REQUESTFAILED: ' + r.url() + ' ' + r.failure()?.errorText));
            page.on('response', r => {
              if (r.url().includes('/flutter/')) responses.push({status:r.status(),url:r.url()});
            });
            try {
              const url = 'https://viril-up.github.io/Viril-self-developement/flutter/?verify=' + Date.now();
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForTimeout(15000);
              const buffer = await page.screenshot({ path: 'viril-live-mobile.png', fullPage: true });
              const png = PNG.sync.read(buffer);
              let darkPixels = 0;
              for (let i=0; i<png.data.length; i+=4) {
                if (png.data[i] < 80 && png.data[i+1] < 85 && png.data[i+2] < 110) darkPixels++;
              }
              const info = await page.evaluate(() => ({
                title: document.title,
                url: location.href,
                flutterView: !!document.querySelector('flutter-view'),
                flutterViewRect: document.querySelector('flutter-view')?.getBoundingClientRect().toJSON() ?? null,
                shadowRoot: !!document.querySelector('flutter-view')?.shadowRoot,
                bodyHTML: document.body.innerHTML.slice(0,3000)
              }));
              console.log('LIVE_HTTP_STATUS=' + response?.status());
              console.log('LIVE_RENDER_RESULT=' + JSON.stringify({ ...info, imageWidth:png.width,imageHeight:png.height,darkPixels }));
              console.log('LIVE_RESOURCE_RESPONSES=' + JSON.stringify(responses));
              console.log('LIVE_BROWSER_ERRORS=' + JSON.stringify(errors));
              if (!response || response.status() !== 200 || !info.flutterView || darkPixels < 1000) process.exitCode = 1;
              if (errors.some(e => /Uncaught|TypeError|ReferenceError|Failed to load|404/i.test(e))) process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node verify-live.cjs

      - name: Upload actual mobile-browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viril-live-mobile-verification
          path: viril-live-mobile.png
          if-no-files-found: ignore
