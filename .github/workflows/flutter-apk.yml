name: Build Viril Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - flutter-v2
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          mkdir -p assets
          cp ../resources/icon.png assets/app_icon.png
          cp ../resources/profile-cover.jpg assets/profile-cover.jpg
          flutter create --platforms=android .
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          source = source.replace('com.example.viril', 'com.viril.selfdev')
          gradle.write_text(source)

          old_main = Path("android/app/src/main/kotlin/com/example/viril/MainActivity.kt")
          new_dir = Path("android/app/src/main/kotlin/com/viril/selfdev")
          new_dir.mkdir(parents=True, exist_ok=True)
          new_main = new_dir / "MainActivity.kt"
          new_main.write_text(
              "package com.viril.selfdev\n\n"
              "import io.flutter.embedding.android.FlutterActivity\n\n"
              "class MainActivity : FlutterActivity()\n"
          )
          if old_main.exists():
              old_main.unlink()

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text().replace('android:label="viril"', 'android:label="Viril"')
          marker = "</activity>"
          callback = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="io.supabase.flutter" android:host="login-callback" />
                  </intent-filter>
          '''
          if "io.supabase.flutter" not in xml:
              xml = xml.replace(marker, callback + "\\n                " + marker, 1)
          manifest.write_text(xml)
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Generate original Viril icon and native splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test legacy state compatibility
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Viril-Flutter-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
