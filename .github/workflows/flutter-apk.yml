name: Build Viril Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - flutter-v2
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          mkdir -p assets/books
          cp ../resources/icon.png assets/app_icon.png
          cp ../resources/splash.png assets/app_splash.png
          cp ../resources/profile-cover.jpg assets/profile-cover.jpg
          cp ../books/118-dumay-medlenno-reshay-byistro.fb2 assets/books/
          cp ../books/148322-samyiy-bogatyiy-chelovek-v-vavilone.fb2 assets/books/
          cp ../books/810-chernyiy-lebed-pod-znakom-nepredskazuemosti-sbornik.fb2 assets/books/
          cp ../books/8365-stoitsizm-na-kazhdyiy-den-366-razmyishleniy-o-mudrosti-vole-i-iskusstv.fb2 assets/books/
          flutter create --platforms=android .
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          source = source.replace('com.example.viril', 'com.viril.selfdev')
          gradle.write_text(source)

          old_main = Path("android/app/src/main/kotlin/com/example/viril/MainActivity.kt")
          new_dir = Path("android/app/src/main/kotlin/com/viril/selfdev")
          new_dir.mkdir(parents=True, exist_ok=True)
          new_main = new_dir / "MainActivity.kt"
          new_main.write_text(
              "package com.viril.selfdev\n\n"
              "import io.flutter.embedding.android.FlutterActivity\n\n"
              "class MainActivity : FlutterActivity()\n"
          )
          if old_main.exists():
              old_main.unlink()

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text().replace('android:label="viril"', 'android:label="Viril"')
          marker = "</activity>"
          callback = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="io.supabase.flutter" android:host="login-callback" />
                  </intent-filter>
          '''
          if "io.supabase.flutter" not in xml:
              xml = xml.replace(marker, callback + "\\n                " + marker, 1)
          manifest.write_text(xml)
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Generate original Viril icon and native splash
        run: |
          python -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          res = Path("android/app/src/main/res")
          icon = Image.open("assets/app_icon.png").convert("RGBA")
          splash = Image.open("assets/app_splash.png").convert("RGBA")

          # Legacy launcher icons at Android density sizes.
          for density, size in {
              "mipmap-mdpi": 48, "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }.items():
              folder = res / density
              folder.mkdir(parents=True, exist_ok=True)
              icon.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png")
              icon.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher_round.png")

          # Android adaptive icon: keep the foreground inside the safe circular area.
          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          mark = icon.copy()
          mark.thumbnail((300, 300), Image.Resampling.LANCZOS)
          foreground.alpha_composite(mark, ((432 - mark.width) // 2, (432 - mark.height) // 2))
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          foreground.save(res / "drawable/ic_launcher_foreground.png")

          (res / "drawable/ic_launcher_background.xml").write_text(
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">'
              '<solid android:color="#0B0D15"/></shape>', encoding="utf-8"
          )
          adaptive = (
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@drawable/ic_launcher_background"/>'
              '<foreground android:drawable="@drawable/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )
          adaptive_dir = res / "mipmap-anydpi-v26"
          adaptive_dir.mkdir(parents=True, exist_ok=True)
          (adaptive_dir / "ic_launcher.xml").write_text(adaptive, encoding="utf-8")
          (adaptive_dir / "ic_launcher_round.xml").write_text(adaptive, encoding="utf-8")

          # Native launch image, shown before Flutter's own one-second loading screen.
          launch = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          mark = splash.copy()
          mark.thumbnail((420, 420), Image.Resampling.LANCZOS)
          launch.alpha_composite(mark, ((512 - mark.width) // 2, (512 - mark.height) // 2))
          launch.save(res / "drawable/launch_image.png")
          (res / "drawable/launch_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">'
              '<item android:drawable="@drawable/ic_launcher_background"/>'
              '<item><bitmap android:gravity="center" android:src="@drawable/launch_image"/></item>'
              '</layer-list>', encoding="utf-8"
          )
          drawable_v21 = res / "drawable-v21"
          drawable_v21.mkdir(parents=True, exist_ok=True)
          (drawable_v21 / "launch_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">'
              '<item android:drawable="@drawable/ic_launcher_background"/>'
              '<item><bitmap android:gravity="center" android:src="@drawable/launch_image"/></item>'
              '</layer-list>', encoding="utf-8"
          )

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "styles.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<resources>'
              '<style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">'
              '<item name="android:windowBackground">@drawable/launch_background</item>'
              '<item name="android:forceDarkAllowed">false</item>'
              '</style>'
              '<style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">'
              '<item name="android:windowBackground">?android:colorBackground</item>'
              '</style></resources>', encoding="utf-8"
          )
          (values / "colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<resources><color name="ic_launcher_background">#0B0D15</color></resources>',
              encoding="utf-8"
          )
          night = res / "values-night"
          night.mkdir(parents=True, exist_ok=True)
          (night / "styles.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<resources>'
              '<style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">'
              '<item name="android:windowBackground">@drawable/launch_background</item>'
              '<item name="android:forceDarkAllowed">false</item>'
              '</style>'
              '<style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">'
              '<item name="android:windowBackground">?android:colorBackground</item>'
              '</style></resources>', encoding="utf-8"
          )
          v31 = res / "values-v31"
          v31.mkdir(parents=True, exist_ok=True)
          (v31 / "styles.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<resources><style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">'
              '<item name="android:windowSplashScreenBackground">#0B0D15</item>'
              '<item name="android:windowSplashScreenAnimatedIcon">@drawable/launch_image</item>'
              '<item name="android:windowSplashScreenAnimationDuration">0</item>'
              '<item name="android:windowBackground">@drawable/launch_background</item>'
              '</style></resources>', encoding="utf-8"
          )
          PY
      - name: Analyze
        run: |
          set +e
          output="$(flutter analyze 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E '(^|[[:space:]])(error|warning) •'; then
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! printf '%s\n' "$output" | grep -q 'info •'; then
            exit "$status"
          fi
          exit 0
      - name: Test legacy state compatibility
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Viril-Flutter-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
