name: Build Viril Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-flutter-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.viril --project-name selfdev .

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Prepare APK artifact
        run: |
          set -e
          mkdir -p dist
          cp flutter_app/build/app/outputs/flutter-apk/app-debug.apk dist/Viril-Flutter-debug.apk
          test -s dist/Viril-Flutter-debug.apk
          ls -lh dist/Viril-Flutter-debug.apk
          sha256sum dist/Viril-Flutter-debug.apk

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: Viril-Flutter-Android-APK
          path: dist/Viril-Flutter-debug.apk
          if-no-files-found: error
          retention-days: 14
