name: viril
description: Viril self-development app — Flutter migration.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  archive: ^3.6.1
  path_drawing: ^1.0.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  intl: ^0.20.3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  xml: ^6.5.0
  html: ^0.15.6
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/exercises.json
    - assets/data/programs.json
    - assets/profile-cover.jpg
    - assets/app_splash.png
    - assets/books/
