name: viril
description: Viril self-development app — Flutter migration.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  archive: ^3.6.1
  path_drawing: ^1.0.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  intl: ^0.20.3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  file_picker: ^8.1.4
  url_launcher: ^6.3.2
  pdfx: ^2.11.0
  epub_view: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/data/exercises.json
    - assets/data/programs.json
    - assets/profile-cover.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#0B0D15"
  adaptive_icon_foreground: assets/app_icon.png

flutter_native_splash:
  color: "#0B0D15"
  image: assets/app_icon.png
  android: true
  ios: false
  android_12:
    color: "#0B0D15"
    image: assets/app_icon.png
    icon_background_color: "#0B0D15"
